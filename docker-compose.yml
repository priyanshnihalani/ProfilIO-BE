services:
  postgres:
    image: postgres:17
    container_name: resume-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_generator

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-backend
    container_name: resume-backend

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    env_file:
      - ./.env

    restart: unless-stopped

volumes:
  postgres_data: