name: Profiio-BE-Deploy

on:
  push:
    branches:
      - main

env:
  ECR_REPOSITORY: profiilo-be
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
  run: |
    scp docker-compose.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/profilio/backend/docker-compose.yml

    ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
      cd /home/ubuntu/profilio/backend

      echo '${{ secrets.BACKEND_ENV }}' > .env

      aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
      | docker login \
        --username AWS \
        --password-stdin \
        ${{ steps.login-ecr.outputs.registry }}

      docker compose pull
      docker compose up -d

      docker image prune -f
    EOF